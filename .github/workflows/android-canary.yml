name: Android Canary

# Produces a DEBUG-signed Cybercare Commons APK as a short-lived Actions
# artifact. No store, no release signing, no tag. Mirrors ci.yml's Mobile job
# (Hermit + pub caches) and adds the upload ci.yml deliberately omits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android canary
    if: github.repository == 'shikoli-turnkeyafrica/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Compute Hermit cache key
        id: hermit-bin-hash
        run: |
          hash="$(find ./bin ! -type d | sort | xargs openssl sha256 | openssl sha256 -r | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Restore Hermit package cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/hermit/pkg
          key: ${{ runner.os }}-hermit-cache-${{ steps.hermit-bin-hash.outputs.hash }}
          restore-keys: ${{ runner.os }}-hermit-cache-
      - name: Prime Flutter SDK
        run: flutter --version
      - name: Restore pub cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Derive canary version
        id: version
        run: |
          set -euo pipefail
          VERSION="0.0.0-test.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building canary $VERSION from $GITHUB_SHA"

      # The brand tests (brand_config, brand_strings, contrast) run here with
      # everything else; this is the only place the whole mobile suite runs.
      - name: Test
        run: cd mobile && flutter test

      - name: Build debug APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd mobile
          rm -rf build/app/outputs/flutter-apk
          flutter build apk --debug --no-pub \
            --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      # Exactly one APK, named for this run; a stale file is a failure, never a
      # silent pick (desktop canary lesson).
      - name: Locate and fingerprint APK
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find mobile/build/app/outputs/flutter-apk -name '*.apk' -type f)
          if [[ ${#APKS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK, found ${#APKS[@]}: ${APKS[*]}"
            exit 1
          fi
          OUT="Cybercare-Commons_${VERSION}_debug.apk"
          mv "${APKS[0]}" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload Android canary APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cybercare-commons-android-canary-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.apk }}.sha256
          if-no-files-found: error
          retention-days: 7
